; Tomada Inteligente UPx — firmware ESP32
; Envs:
;   esp32dev      -> firmware real (sensores físicos)
;   esp32dev-sim  -> firmware com sensores simulados (só o ESP32 no USB)
;   native        -> testes unitários da lógica (roda no PC)

[platformio]
default_envs = esp32dev

[esp32_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
    mandulaj/PZEM-004T-v30@^1.1.2
    ncmreynolds/ld2410@^0.1.4
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFW_VERSION=\"1.0.0\"

[env:esp32dev]
extends = esp32_base

[env:esp32dev-sim]
extends = esp32_base
build_flags =
    ${esp32_base.build_flags}
    -DSIMULATE=1

[env:native]
platform = native
build_flags = -std=c++17
test_build_src = false
